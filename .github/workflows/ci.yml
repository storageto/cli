name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      - name: Vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Reproduce locally with:
      #   go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...
      # Keep this version in step with that command. The old v1.59.1 pin could not be
      # run locally at all on a current Go toolchain (its vendored x/tools fails to
      # compile on Go 1.25), so nobody could reproduce this job before pushing.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
